<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resource Allocator</title>
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
<header>
<h1>Resource Allocator</h1>
<span class="tag">Modular • Local only</span>


<div class="toolbar grow">
<button class="btn primary" id="addPerson">Add Person</button>
<button class="btn" id="addProject">Add Project</button>
<button class="btn" id="exportBtn">Export JSON</button>
<label class="btn ghost" for="importFile">Import JSON</label>
<input id="importFile" type="file" accept="application/json" hidden>
<button class="btn" id="resetBtn">Reset</button>
<div class="toolbar-right">
<label class="help">Weeks</label>
<input class="input" id="numWeeks" type="number" min="4" max="52" value="16">
<label class="help">Start week</label>
<input class="input" id="startDate" type="date">
</div>
</div>
</header>


<div class="main">
<aside class="side">
<h3 style="display:flex; align-items:center; justify-content:space-between">People
<span>
<button class="btn" id="addPeopleGroup" title="Add People Group">＋ Group</button>
<button class="btn primary" id="addPersonSidebar" title="Add Person">＋ Person</button>
</span>
</h3>
<div id="peopleTree" class="list"></div>


<h3 style="margin-top:14px; display:flex; align-items:center; justify-content:space-between">Projects
<span>
<button class="btn" id="addProjectGroup" title="Add Project Group">＋ Group</button>
<button class="btn" id="addProjectSub" title="Add Subgroup">＋ Sub</button>
<button class="btn primary" id="addProjectSidebar" title="Add Project">＋ Project</button>
</span>
</h3>
<div id="projectsTree" class="list"></div>
</aside>


<section class="content" id="content"></section>
</div>


<script type="module" src="./js/main.js"></script>
</body>
</html>
