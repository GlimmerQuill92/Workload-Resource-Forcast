<section class="screen">
  <h1>Village Square</h1>
  <p>You arrive in the square. A noticeboard flaps in the wind.</p>

  <label>
    Your name:
    <input id="nameInput" placeholder="Type name..." />
  </label>

  <div class="actions">
    <button id="toBattle">Look for trouble</button>
  </div>

  <script type="module">
    import { state } from '../js/state.js';
    import { save } from '../js/storage.js';

    const input = document.getElementById('nameInput');
    input.value = state.player.name || '';
    input.addEventListener('input', () => {
      state.player.name = input.value;
      save(); // persists + re-renders footer
    });

    document.getElementById('toBattle').addEventListener('click', () => {
      state.flags.enteredBattleFrom = 'square';
      location.hash = '#/battle';
    });
  </script>
</section>
